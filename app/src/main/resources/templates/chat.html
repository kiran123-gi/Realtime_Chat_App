<!DOCTYPE html>
<html>
<head>
    <title>Chat App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
</head>

<body>
<div class="container mt-4">
    <h2>Real-Time Chat</h2>

    <div id="chatBox" class="border p-3 mb-3"
         style="height:300px; overflow-y:auto;"></div>

    <input id="sender" class="form-control mb-2" placeholder="Your name">

    <div class="input-group">
        <input id="message" class="form-control" placeholder="Message">
        <button onclick="sendMessage()" class="btn btn-primary">Send</button>
    </div>
</div>

<script>
    let stompClient = null;

    function connect() {
        const socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            stompClient.subscribe('/topic/messages', function (msg) {
                showMessage(JSON.parse(msg.body));
            });
        });
    }

    function sendMessage() {
        const sender = document.getElementById('sender').value;
        const content = document.getElementById('message').value;

        stompClient.send("/app/sendMessage", {},
            JSON.stringify({ sender, content }));

        document.getElementById('message').value = "";
    }

    function showMessage(message) {
        const chat = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.textContent = message.sender + ": " + message.content;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    window.onload = connect;
</script>
</body>
</html>
